info:
  name: Get Orders
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/orders"
  params:
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: pageSize
      value: "100"
      type: query
      disabled: true
    - name: customerId
      value: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
      type: query
      disabled: true
    - name: status
      value: "2"
      type: query
      disabled: true
    - name: from
      value: 2026-10-20T05:49:51Z
      type: query
      disabled: true
    - name: to
      value: 2026-10-31T23:59:59Z
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const response = res.getBody();

        test("Deve retornar HTTP 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Deve retornar uma coleção paginada", function () {
            expect(response.items).to.be.an("array");
            expect(response.page).to.be.a("number");
            expect(response.pageSize).to.be.a("number");
            expect(response.totalCount).to.be.a("number");
            expect(response.totalPages).to.be.a("number");
        });

        test("Deve retornar metadados de paginação válidos", function () {
            expect(response.page).to.be.at.least(1);
            expect(response.pageSize).to.be.within(1, 100);
            expect(response.totalCount).to.be.at.least(0);

            expect(response.totalPages).to.equal(
                Math.ceil(response.totalCount / response.pageSize)
            );

            expect(response.items.length).to.be.at.most(response.pageSize);
        });

        test("Deve retornar pedidos com estrutura válida", function () {
            response.items.forEach(function (order) {
                expect(order.id).to.be.a("string");
                expect(order.customerId).to.be.a("string");
                expect(order.currency).to.be.a("string");
                expect(order.status).to.be.oneOf([1, 2, 3]);
                expect(order.total).to.be.a("number");
                expect(order.createdAt).to.be.a("string");
                expect(order.items).to.be.an("array");

                const calculatedTotal = order.items.reduce(
                    (total, item) => total + item.quantity * item.unitPrice,
                    0
                );

                expect(calculatedTotal).to.equal(order.total);
            });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
